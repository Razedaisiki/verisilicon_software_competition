name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Check ASCII policy
        run: python scripts/check_ascii.py

      - name: Install evaluation dataset dependency
        run: python -m pip install --disable-pip-version-check -r evaluation/requirements.txt

      - name: Validate locked evaluation catalog
        run: python scripts/eval_dataset.py validate evaluation/eval30/sources --locked

      - name: Check evaluation dataset automation
        run: python scripts/check_eval_dataset.py

      - name: Check Windows evaluation runner syntax
        shell: pwsh
        run: |
          foreach ($script in '.\evaluate.ps1', '.\sweep.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw "$script`n$($errors -join "`n")" }
          }

      - name: Check development PNG converter
        run: python scripts/check_div2k_converter.py

      - name: Build release binary
        run: cargo build --locked --release

      - name: Verify processing benchmark policies
        run: python scripts/check_processing_bench.py

      - name: Verify zero dependency graph
        run: cargo tree --locked --edges normal

      - name: Verify reproducible PowerShell one-click build
        run: .\build.ps1

      - name: Create synthetic package-test log
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/ci-synthetic-ai-logs | Out-Null
          Set-Content -Encoding ascii -Path target/ci-synthetic-ai-logs/NOT-A-REAL-SUBMISSION.txt -Value "Synthetic CI-only log for structural package testing."

      - name: Create and verify Windows submission candidate
        run: >-
          python scripts/submission_package.py create target/ci-submission-candidate.tar
          --binary bin/sr.exe
          --logs target/ci-synthetic-ai-logs --target x86_64-pc-windows-msvc

      - name: Verify deterministic Windows TAR creation
        shell: pwsh
        run: |
          python scripts/submission_package.py create target/ci-submission-candidate-copy.tar --binary bin/sr.exe --logs target/ci-synthetic-ai-logs --target x86_64-pc-windows-msvc
          $first = (Get-FileHash -Algorithm SHA256 -LiteralPath target/ci-submission-candidate.tar).Hash
          $second = (Get-FileHash -Algorithm SHA256 -LiteralPath target/ci-submission-candidate-copy.tar).Hash
          if ($first -ne $second) { throw "Repeated package creation was not byte-identical." }

      - name: Verify and extract Windows submission candidate
        run: |
          python scripts/submission_package.py verify target/ci-submission-candidate.tar
          python scripts/submission_package.py extract target/ci-submission-candidate.tar target/ci-extracted

      - name: Verify packaged offline rebuild identity
        shell: pwsh
        run: '& target/ci-extracted/submit_pkg/build.ps1'
